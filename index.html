<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MultiCamPong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; height: 100vh; overflow: hidden; position: relative; font-family: monospace; }
    #divider { position: absolute; left: 50vw; top: 0; width: 0; height: 100vh; border-left: 2px dashed white; z-index: 10; pointer-events: none; }
    #score-center { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 4px 30px; border-radius: 8px; z-index: 20; }
    #camera-panel { width: 50vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; background: #111; z-index: 1; }
    #input-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #game-panel { width: 50vw; height: 100vh; position: relative; background: black; z-index: 1; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #ui { position: absolute; bottom: 20px; left: 20px; color: white; font-size: 14px; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 8px; z-index: 25; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    #signaling-panel { position: absolute; bottom: 20px; right: 20px; color: white; font-size: 12px; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 8px; z-index: 25; display: flex; flex-direction: column; gap: 6px; max-width: 320px; }
    .sdp-block { display: flex; flex-direction: column; gap: 2px; }
    .sdp-block textarea { width: 100%; height: 55px; font-size: 10px; background: #333; color: white; border: 1px solid #888; resize: none; font-family: monospace; }
    .copy-sdp-btn { font-size: 10px; padding: 2px 6px; background: #555; color: white; border: 1px solid #aaa; border-radius: 3px; cursor: pointer; align-self: flex-end; }
    #signaling-panel button { font-size: 11px; padding: 4px 8px; cursor: pointer; background: #444; color: white; border: 1px solid white; border-radius: 4px; }
    #signaling-panel button:disabled { opacity: 0.5; cursor: not-allowed; }
    #lang-switch { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; border-radius: 4px; padding: 4px 8px; font-size: 16px; cursor: pointer; z-index: 30; }
    #status-text { color: #0f0; }
    #ice-status { font-size: 11px; color: #aaa; margin-top: 2px; }
    #mic-status { margin-left: 10px; color: #ff0; cursor: pointer; }
    #room-id-display { font-weight: bold; }
    #copy-link-btn { background: #444; color: white; border: 1px solid white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    #guest-join-form { display: flex; gap: 5px; align-items: center; }
    #room-input { padding: 3px 6px; font-size: 13px; width: 120px; border-radius: 4px; border: 1px solid #888; background: #333; color: white; }
    #join-btn { background: #444; color: white; border: 1px solid white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .instruction { font-size: 11px; color: #ccc; margin-top: 2px; }
    .warning { color: #ff8; font-size: 11px; }
    #disconnect-btn { position: absolute; bottom: 20px; right: 20px; z-index: 30; background: #a33; color: white; border: 1px solid white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; display: none; }
  </style>
</head>
<body>
  <div id="divider"></div>
  <div id="score-center">0 : 0</div>
  <div id="camera-panel">
    <video id="input-video" autoplay playsinline muted></video>
  </div>
  <div id="game-panel">
    <video id="remote-video" autoplay playsinline></video>
    <canvas id="game-canvas"></canvas>
    <div id="ui">
      <span id="room-id-display"></span>
      <button id="copy-link-btn">Копировать ссылку</button>
      <span id="status-text"></span>
      <span id="ice-status"></span>
      <span id="mic-status" title="Микрофон">🔇</span>
      <div id="guest-join-form" style="display: none;">
        <input id="room-input" type="text" placeholder="ID комнаты">
        <button id="join-btn">Подключиться</button>
      </div>
    </div>
    <div id="signaling-panel" style="display: none;">
      <span id="sig-title">Ручная сигнализация</span>
      <div class="sdp-block">
        <textarea id="local-sdp" placeholder="Ваш SDP появится здесь" readonly></textarea>
        <button class="copy-sdp-btn" id="copy-local-sdp">📋 Копировать</button>
      </div>
      <div class="sdp-block">
        <textarea id="remote-sdp" placeholder="Вставьте SDP собеседника"></textarea>
      </div>
      <button id="create-offer-btn">Создать предложение (хост)</button>
      <button id="accept-offer-btn">Принять предложение и ответить (гость)</button>
      <button id="send-answer-btn" style="display:none;">📤 Отправить ответ хосту</button>
      <button id="accept-answer-btn" disabled>Принять ответ (хост)</button>
      <div id="instruction" class="instruction"></div>
      <div id="sdp-warning" class="warning"></div>
    </div>
    <button id="disconnect-btn">🔌 Отключиться</button>
    <button id="lang-switch">🌐</button>
  </div>

  <!-- TensorFlow.js + Handpose (надёжное распознавание пальцев) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@3.18.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@3.18.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@3.18.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>

  <script>
    (function() {
      const translations = {
        ru: {
          room_prefix: 'ID комнаты:',
          copy_link: 'Копировать ссылку',
          join: 'Подключиться',
          room_placeholder: 'ID комнаты',
          signaling_title: 'Ручная сигнализация',
          local_sdp_placeholder: 'Ваш SDP появится здесь',
          remote_sdp_placeholder: 'Вставьте SDP собеседника',
          create_offer: 'Создать предложение (хост)',
          accept_offer: 'Принять предложение и ответить (гость)',
          accept_answer: 'Принять ответ (хост)',
          send_answer: '📤 Отправить ответ хосту',
          close_connection: 'Отключиться',
          status_waiting: 'Ожидание соперника...',
          status_gathering: 'Сбор ICE-кандидатов...',
          status_offer_ready: 'Предложение готово, скопируйте SDP',
          status_waiting_answer: 'Ожидание ответа...',
          status_connecting: 'Установка соединения...',
          status_connected: 'Соперник подключился!',
          status_disconnected: 'Соперник отключился',
          alert_camera: 'Не удалось запустить камеру/микрофон. Проверьте HTTPS.',
          alert_bad_sdp: 'Ошибка SDP. Подробности в консоли (F12).',
          mic_title: 'Микрофон',
          ice_checking: 'Проверка соединения...',
          ice_connected: 'Канал установлен',
          ice_disconnected: 'Канал разорван',
          link_copied: 'Ссылка скопирована!',
          host_waiting: 'Отправьте SDP гостю',
          copy_sdp: '📋 Копировать',
          sdp_copied: 'SDP скопирован!',
          instruction_guest: 'Вставьте SDP хоста (offer) и нажмите «Принять предложение».',
          instruction_host: 'Создайте предложение, отправьте гостю. Получив ответ, вставьте и нажмите «Принять ответ».',
          answer_ready: 'Ваш ответ готов! Нажмите «Отправить ответ хосту», скопируйте SDP и передайте хосту.',
          alert_empty_sdp: 'Поле SDP пустое.',
          alert_invalid_json: 'Текст не является JSON.',
          alert_missing_type_sdp: 'Нужны поля type и sdp.',
          alert_wrong_type_guest: 'Ожидался offer, получен {type}.',
          alert_wrong_type_host: 'Ожидался answer, получен {type}.'
        },
        en: {
          room_prefix: 'Room ID:',
          copy_link: 'Copy link',
          join: 'Connect',
          room_placeholder: 'Room ID',
          signaling_title: 'Manual Signaling',
          local_sdp_placeholder: 'Your SDP will appear here',
          remote_sdp_placeholder: 'Paste opponent SDP',
          create_offer: 'Create Offer (host)',
          accept_offer: 'Accept Offer & Answer (guest)',
          accept_answer: 'Accept Answer (host)',
          send_answer: '📤 Send answer to host',
          close_connection: 'Disconnect',
          status_waiting: 'Waiting for opponent...',
          status_gathering: 'Gathering ICE candidates...',
          status_offer_ready: 'Offer ready, copy SDP',
          status_waiting_answer: 'Waiting for answer...',
          status_connecting: 'Establishing connection...',
          status_connected: 'Opponent connected!',
          status_disconnected: 'Opponent disconnected',
          alert_camera: 'Could not access camera/mic. Check HTTPS.',
          alert_bad_sdp: 'SDP error. See console (F12).',
          mic_title: 'Microphone',
          ice_checking: 'Checking connection...',
          ice_connected: 'Channel established',
          ice_disconnected: 'Channel broken',
          link_copied: 'Link copied!',
          host_waiting: 'Send SDP to guest',
          copy_sdp: '📋 Copy',
          sdp_copied: 'SDP copied!',
          instruction_guest: 'Paste host SDP (offer) and press "Accept Offer".',
          instruction_host: 'Create offer, send to guest. Paste answer and press "Accept Answer".',
          answer_ready: 'Answer ready! Click "Send answer to host", copy SDP and send it.',
          alert_empty_sdp: 'SDP field is empty.',
          alert_invalid_json: 'Text is not valid JSON.',
          alert_missing_type_sdp: 'Object must have type and sdp.',
          alert_wrong_type_guest: 'Expected offer, got {type}.',
          alert_wrong_type_host: 'Expected answer, got {type}.'
        }
      };

      let lang = 'ru';
      function t(key, params) { let s = translations[lang][key] || key; if (params) Object.entries(params).forEach(([k,v]) => s = s.replace(`{${k}}`, v)); return s; }
      function detectLang() {
        const saved = localStorage.getItem('pong-lang');
        return (saved === 'ru' || saved === 'en') ? saved : (navigator.language.startsWith('ru') ? 'ru' : 'en');
      }
      function setLang(l) {
        lang = l;
        localStorage.setItem('pong-lang', l);
        applyTranslations();
        document.getElementById('lang-switch').textContent = l === 'ru' ? '🇷🇺' : '🇬🇧';
      }
      function applyTranslations() {
        document.getElementById('sig-title').textContent = t('signaling_title');
        document.getElementById('local-sdp').placeholder = t('local_sdp_placeholder');
        document.getElementById('remote-sdp').placeholder = t('remote_sdp_placeholder');
        document.getElementById('create-offer-btn').textContent = t('create_offer');
        document.getElementById('accept-offer-btn').textContent = t('accept_offer');
        document.getElementById('accept-answer-btn').textContent = t('accept_answer');
        document.getElementById('send-answer-btn').textContent = t('send_answer');
        document.getElementById('disconnect-btn').textContent = '🔌 ' + t('close_connection');
        document.getElementById('mic-status').title = t('mic_title');
        document.getElementById('copy-link-btn').textContent = t('copy_link');
        document.getElementById('join-btn').textContent = t('join');
        document.getElementById('room-input').placeholder = t('room_placeholder');
        document.getElementById('copy-local-sdp').textContent = t('copy_sdp');
        if (window._status) setStatus(window._status);
        if (window._ice) setIce(window._ice);
        if (window._instr) setInstr(window._instr);
      }
      document.getElementById('lang-switch').addEventListener('click', () => setLang(lang === 'ru' ? 'en' : 'ru'));

      function setStatus(k) { window._status = k; document.getElementById('status-text').textContent = t(k); }
      function setIce(k) { window._ice = k; document.getElementById('ice-status').textContent = t(k); }
      function setInstr(k) { window._instr = k; document.getElementById('instruction').textContent = t(k); }
      function warn(msg) { const w = document.getElementById('sdp-warning'); w.textContent = msg; setTimeout(() => w.textContent = '', 5000); }

      const videoEl = document.getElementById('input-video');
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const remoteVideo = document.getElementById('remote-video');
      const scoreDiv = document.getElementById('score-center');
      const roomSpan = document.getElementById('room-id-display');
      const copyLinkBtn = document.getElementById('copy-link-btn');
      const joinForm = document.getElementById('guest-join-form');
      const roomInput = document.getElementById('room-input');
      const joinBtn = document.getElementById('join-btn');
      const micBtn = document.getElementById('mic-status');
      const localSdp = document.getElementById('local-sdp');
      const remoteSdp = document.getElementById('remote-sdp');
      const copySdpBtn = document.getElementById('copy-local-sdp');
      const createOffer = document.getElementById('create-offer-btn');
      const acceptOffer = document.getElementById('accept-offer-btn');
      const sendAnswer = document.getElementById('send-answer-btn');
      const acceptAnswer = document.getElementById('accept-answer-btn');
      const disconnectBtn = document.getElementById('disconnect-btn');

      let cw, ch;
      const PW = 12, PH = 80;
      const player = { x: 20, y: 0 };
      const opponent = { x: 0, y: 0 };
      const ball = { x: 0, y: 0, r: 8, vx: 0, vy: 0, speed: 5 };
      let scoreP = 0, scoreO = 0;
      let handY = 0.5, hand = false;

      let pc = null, dc = null, isHost = false, remoteY = 0, localStream, roomId = '';
      const rtcCfg = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }
        ]
      };
      const urlRoom = new URLSearchParams(location.search).get('room');

      function resize() {
        const gp = document.getElementById('game-panel');
        cw = gp.clientWidth; ch = gp.clientHeight;
        canvas.width = cw; canvas.height = ch;
        player.x = 20;
        opponent.x = cw - PW - 20;
        player.y = (ch - PH) / 2;
        opponent.y = (ch - PH) / 2;
        resetBall();
      }
      function resetBall() {
        ball.x = cw / 2; ball.y = ch / 2;
        const a = (Math.random() * 0.5 + 0.25) * Math.PI;
        ball.vx = ball.speed * Math.cos(a) * (Math.random() < 0.5 ? 1 : -1);
        ball.vy = ball.speed * Math.sin(a) * (Math.random() < 0.5 ? 1 : -1);
      }
      function updateScore() { scoreDiv.textContent = `${scoreP} : ${scoreO}`; }

      function isMultiplayer() { return dc && dc.readyState === 'open'; }

      function loop() {
        if (!cw || !ch) return requestAnimationFrame(loop);

        // Управление игроком (рука)
        if (hand) {
          let cy = handY * ch;
          cy = Math.max(PH/2, Math.min(ch - PH/2, cy));
          player.y = cy - PH/2;
        }

        // ИИ или соперник
        if (!isMultiplayer()) {
          const aiCy = opponent.y + PH/2;
          if (ball.y < aiCy - 5) opponent.y -= 4.5;
          else if (ball.y > aiCy + 5) opponent.y += 4.5;
        } else {
          opponent.y = remoteY;
        }
        opponent.y = Math.max(0, Math.min(ch - PH, opponent.y));

        // Отправка позиции в мультиплеере
        if (isMultiplayer() && hand) {
          try { dc.send(JSON.stringify({ type: 'paddle', y: player.y })); } catch(e) {}
        }

        // Физика мяча (всегда)
        if (!isMultiplayer() || isHost) {
          ball.x += ball.vx;
          ball.y += ball.vy;

          if (ball.y - ball.r <= 0 || ball.y + ball.r >= ch) {
            ball.vy *= -1;
            ball.y = Math.max(ball.r, Math.min(ch - ball.r, ball.y));
          }

          if (ball.vx < 0 && ball.x - ball.r <= player.x + PW &&
              ball.x - ball.r >= player.x &&
              ball.y >= player.y && ball.y <= player.y + PH) {
            const hit = (ball.y - player.y) / PH;
            const ang = (hit - 0.5) * (Math.PI/3);
            ball.vx = ball.speed * Math.cos(ang);
            ball.vy = ball.speed * Math.sin(ang);
            if (ball.vx < 0) ball.vx *= -1;
            ball.speed = Math.min(ball.speed + 0.2, 12);
          }
          if (ball.vx > 0 && ball.x + ball.r >= opponent.x &&
              ball.x + ball.r <= opponent.x + PW &&
              ball.y >= opponent.y && ball.y <= opponent.y + PH) {
            const hit = (ball.y - opponent.y) / PH;
            const ang = (hit - 0.5) * (Math.PI/3);
            ball.vx = -ball.speed * Math.cos(ang);
            ball.vy = ball.speed * Math.sin(ang);
            if (ball.vx > 0) ball.vx *= -1;
            ball.speed = Math.min(ball.speed + 0.2, 12);
          }

          if (ball.x + ball.r < 0) { scoreO++; updateScore(); resetBall(); }
          else if (ball.x - ball.r > cw) { scoreP++; updateScore(); resetBall(); }

          if (isMultiplayer() && isHost) {
            try {
              dc.send(JSON.stringify({
                type: 'state',
                ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, speed: ball.speed },
                score: { player: scoreP, opponent: scoreO }
              }));
            } catch(e) {}
          }
        }

        ctx.clearRect(0, 0, cw, ch);
        ctx.fillStyle = 'white';
        ctx.fillRect(player.x, player.y, PW, PH);
        ctx.fillRect(opponent.x, opponent.y, PW, PH);
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fill();
        ctx.closePath();

        requestAnimationFrame(loop);
      }

      // Инициализация Handpose
      async function initHandpose() {
        const model = await handpose.load();
        console.log('Handpose model loaded');
        async function detect() {
          try {
            if (videoEl.readyState >= 2) {
              const predictions = await model.estimateHands(videoEl);
              if (predictions.length > 0) {
                const keypoints = predictions[0].landmarks;
                // Индексы: 4 – большой палец, 8 – указательный
                const thumb = keypoints[4];
                const index = keypoints[8];
                if (thumb && index) {
                  // Средняя точка между большим и указательным
                  const midY = (thumb[1] + index[1]) / 2;
                  handY = midY / videoEl.videoHeight;
                  hand = true;
                  console.log('hand detected Y:', handY.toFixed(2));
                } else {
                  hand = false;
                }
              } else {
                hand = false;
              }
            }
          } catch (e) {
            // игнорируем ошибки
          }
          requestAnimationFrame(detect);
        }
        detect();
      }

      async function initCam() {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: true });
        videoEl.srcObject = localStream;
        videoEl.muted = true;
        updateMic();
        initHandpose(); // запуск распознавания рук
      }

      function updateMic() {
        if (!localStream) return;
        const t = localStream.getAudioTracks()[0];
        micBtn.textContent = t?.enabled ? '🎤' : '🔇';
        micBtn.style.color = t?.enabled ? '#0f0' : '#ff0';
      }
      micBtn.addEventListener('click', () => {
        const t = localStream?.getAudioTracks()[0];
        if (t) { t.enabled = !t.enabled; updateMic(); }
      });

      function makePC() {
        if (pc) { pc.close(); pc = null; }
        if (dc) { dc.close(); dc = null; }
        const p = new RTCPeerConnection(rtcCfg);
        p.ontrack = e => {
          if (e.streams?.[0]) {
            remoteVideo.srcObject = e.streams[0];
            setStatus('status_connected');
            disconnectBtn.style.display = 'block';
          }
        };
        p.oniceconnectionstatechange = () => {
          const s = p.iceConnectionState;
          if (s === 'checking') { setIce('ice_checking'); setStatus('status_connecting'); }
          else if (s === 'connected' || s === 'completed') {
            setIce('ice_connected');
            setStatus('status_connected');
            disconnectBtn.style.display = 'block';
          } else if (s === 'disconnected' || s === 'failed') {
            setIce('ice_disconnected');
            setStatus('status_disconnected');
            disconnectBtn.style.display = 'none';
          }
        };
        if (isHost) {
          const d = p.createDataChannel('game');
          setupDC(d);
        } else {
          p.ondatachannel = e => setupDC(e.channel);
        }
        localStream?.getTracks().forEach(t => p.addTrack(t, localStream));
        pc = p;
        return p;
      }

      function setupDC(ch) {
        ch.onopen = () => {
          if (isHost) {
            ch.send(JSON.stringify({
              type: 'state',
              ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, speed: ball.speed },
              score: { player: scoreP, opponent: scoreO }
            }));
          }
        };
        ch.onmessage = e => {
          try {
            const m = JSON.parse(e.data);
            if (m.type === 'paddle') remoteY = m.y;
            else if (m.type === 'state' && !isHost) {
              ball.x = m.ball.x; ball.y = m.ball.y;
              ball.vx = m.ball.vx; ball.vy = m.ball.vy; ball.speed = m.ball.speed;
              scoreP = m.score.player; scoreO = m.score.opponent;
              updateScore();
            }
          } catch(err) {}
        };
        ch.onclose = () => {
          dc = null; remoteY = 0;
          if (remoteVideo.srcObject) remoteVideo.srcObject = null;
          setStatus('status_disconnected');
          disconnectBtn.style.display = 'none';
        };
        dc = ch;
      }

      function closeConn() {
        if (dc) { dc.close(); dc = null; }
        if (pc) { pc.close(); pc = null; }
        remoteVideo.srcObject = null;
        remoteY = 0;
        localSdp.value = '';
        acceptOffer.disabled = false;
        acceptAnswer.disabled = true;
        sendAnswer.style.display = 'none';
        setIce(''); setInstr('');
        disconnectBtn.style.display = 'none';
        setStatus('status_disconnected');
      }
      disconnectBtn.addEventListener('click', closeConn);

      function parseSDP(txt) {
        if (!txt) { alert(t('alert_empty_sdp')); return null; }
        try {
          const o = JSON.parse(txt);
          if (!o.type || !o.sdp) { alert(t('alert_missing_type_sdp')); return null; }
          return o;
        } catch { alert(t('alert_invalid_json')); return null; }
      }

      copySdpBtn.addEventListener('click', () => {
        const txt = localSdp.value.trim();
        if (!txt) return;
        navigator.clipboard.writeText(txt).then(() => {
          copySdpBtn.textContent = '✅ ' + t('sdp_copied');
          setTimeout(() => copySdpBtn.textContent = t('copy_sdp'), 2000);
        }).catch(() => {
          localSdp.select(); document.execCommand('copy');
          copySdpBtn.textContent = '✅ ' + t('sdp_copied');
          setTimeout(() => copySdpBtn.textContent = t('copy_sdp'), 2000);
        });
      });

      createOffer.addEventListener('click', async () => {
        createOffer.disabled = true;
        isHost = true;
        closeConn();
        const p = makePC();
        setStatus('status_gathering'); setInstr('');
        try {
          const offer = await p.createOffer();
          await p.setLocalDescription(offer);
          await new Promise(r => { if (p.iceGatheringState === 'complete') r(); else p.onicegatheringstatechange = () => { if (p.iceGatheringState === 'complete') r(); }; });
          localSdp.value = JSON.stringify(p.localDescription);
          setStatus('status_offer_ready'); setInstr('instruction_host');
          acceptAnswer.disabled = false; sendAnswer.style.display = 'none';
        } catch (e) { alert(t('alert_bad_sdp')); closeConn(); setStatus('status_waiting'); }
        finally { createOffer.disabled = false; }
      });

      acceptOffer.addEventListener('click', async () => {
        acceptOffer.disabled = true;
        const raw = remoteSdp.value.trim().replace(/^[\s\uFEFF\xA0]+|[\s\uFEFF\xA0]+$/g, '');
        const desc = parseSDP(raw);
        if (!desc) { acceptOffer.disabled = false; return; }
        if (desc.type !== 'offer') { warn(t('alert_wrong_type_guest', { type: desc.type })); acceptOffer.disabled = false; return; }
        isHost = false;
        closeConn();
        const p = makePC();
        setStatus('status_connecting'); setInstr('instruction_guest');
        try {
          await p.setRemoteDescription(new RTCSessionDescription(desc));
          setStatus('status_gathering');
          const answer = await p.createAnswer();
          await p.setLocalDescription(answer);
          await new Promise(r => { if (p.iceGatheringState === 'complete') r(); else p.onicegatheringstatechange = () => { if (p.iceGatheringState === 'complete') r(); }; });
          localSdp.value = JSON.stringify(p.localDescription);
          setStatus('status_waiting_answer'); setInstr('answer_ready');
          sendAnswer.style.display = 'block';
        } catch (e) { alert(t('alert_bad_sdp')); closeConn(); setStatus('status_waiting'); acceptOffer.disabled = false; }
      });

      sendAnswer.addEventListener('click', () => {
        const txt = localSdp.value.trim();
        if (txt) {
          navigator.clipboard.writeText(txt).then(() => alert(t('sdp_copied') + ' ' + t('host_waiting'))).catch(() => {
            localSdp.select(); document.execCommand('copy'); alert(t('sdp_copied') + ' ' + t('host_waiting'));
          });
        }
      });

      acceptAnswer.addEventListener('click', async () => {
        acceptAnswer.disabled = true;
        const raw = remoteSdp.value.trim().replace(/^[\s\uFEFF\xA0]+|[\s\uFEFF\xA0]+$/g, '');
        const desc = parseSDP(raw);
        if (!desc) { acceptAnswer.disabled = false; return; }
        if (desc.type !== 'answer') { warn(t('alert_wrong_type_host', { type: desc.type })); acceptAnswer.disabled = false; return; }
        if (!pc) { alert('Нет соединения.'); acceptAnswer.disabled = false; return; }
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(desc));
          setStatus('status_connecting'); setInstr('');
        } catch (e) { alert(t('alert_bad_sdp')); closeConn(); acceptAnswer.disabled = false; setStatus('status_waiting'); }
      });

      function genRoom() { return 'pong-' + Math.random().toString(36).substr(2, 8); }
      function showRoom(id) {
        roomSpan.textContent = t('room_prefix') + ' ' + id;
        if (isHost) {
          copyLinkBtn.style.display = 'inline-block';
          joinForm.style.display = 'none';
          document.getElementById('signaling-panel').style.display = 'block';
          setInstr('instruction_host');
        } else {
          copyLinkBtn.style.display = 'none';
          joinForm.style.display = urlRoom ? 'none' : 'flex';
          document.getElementById('signaling-panel').style.display = 'block';
          setInstr('instruction_guest');
        }
      }
      copyLinkBtn.addEventListener('click', () => {
        const u = new URL(location.href);
        u.searchParams.set('room', roomId);
        navigator.clipboard.writeText(u.toString()).then(() => { setStatus('link_copied'); setTimeout(() => { if (window._status === 'link_copied') setStatus('status_waiting'); }, 2000); });
      });
      joinBtn.addEventListener('click', () => {
        const rid = roomInput.value.trim();
        if (rid) {
          isHost = false; roomId = rid;
          history.replaceState({}, '', `${location.pathname}?room=${rid}`);
          showRoom(rid); joinForm.style.display = 'none';
          setStatus('status_waiting');
        }
      });

      window.addEventListener('load', async () => {
        lang = detectLang(); setLang(lang);
        try {
          await initCam();
          resize(); updateScore();
          window.addEventListener('resize', resize);
          loop();
          if (urlRoom) { isHost = false; roomId = urlRoom; showRoom(urlRoom); setStatus('status_waiting'); }
          else { isHost = true; roomId = genRoom(); history.replaceState({}, '', `${location.pathname}?room=${roomId}`); showRoom(roomId); setStatus('status_waiting'); }
        } catch (e) { alert(t('alert_camera')); }
      });
    })();
  </script>
</body>
</html>
