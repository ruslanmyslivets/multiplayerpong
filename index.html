<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MultiCamPong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; height: 100vh; overflow: hidden; position: relative; font-family: monospace; }
    #divider { position: absolute; left: 50vw; top: 0; width: 0; height: 100vh; border-left: 2px dashed white; z-index: 10; pointer-events: none; }
    #score-center { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 4px 30px; border-radius: 8px; z-index: 20; }
    #camera-panel { width: 50vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; background: #111; z-index: 1; }
    #input-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #game-panel { width: 50vw; height: 100vh; position: relative; background: black; z-index: 1; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #ui { position: absolute; bottom: 20px; left: 20px; color: white; font-size: 14px; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 8px; z-index: 25; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    #signaling-panel { position: absolute; bottom: 20px; right: 20px; color: white; font-size: 12px; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 8px; z-index: 25; display: flex; flex-direction: column; gap: 6px; max-width: 320px; transition: opacity 0.4s; }
    #signaling-panel.hidden { opacity: 0; pointer-events: none; }
    .sdp-block { display: flex; flex-direction: column; gap: 2px; }
    .sdp-block textarea { width: 100%; height: 55px; font-size: 10px; background: #333; color: white; border: 1px solid #888; resize: none; font-family: monospace; }
    .copy-sdp-btn { font-size: 10px; padding: 2px 6px; background: #555; color: white; border: 1px solid #aaa; border-radius: 3px; cursor: pointer; align-self: flex-end; }
    #signaling-panel button { font-size: 11px; padding: 4px 8px; cursor: pointer; background: #444; color: white; border: 1px solid white; border-radius: 4px; }
    #signaling-panel button:disabled { opacity: 0.5; cursor: not-allowed; }
    #lang-switch { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; border-radius: 4px; padding: 4px 8px; font-size: 16px; cursor: pointer; z-index: 30; }
    #status-text { color: #0f0; }
    #ice-status { font-size: 11px; color: #aaa; margin-top: 2px; }
    #mic-status { margin-left: 10px; color: #ff0; cursor: pointer; }
    #room-id-display { font-weight: bold; }
    #copy-link-btn { background: #444; color: white; border: 1px solid white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    #guest-join-form { display: flex; gap: 5px; align-items: center; }
    #room-input { padding: 3px 6px; font-size: 13px; width: 120px; border-radius: 4px; border: 1px solid #888; background: #333; color: white; }
    #join-btn { background: #444; color: white; border: 1px solid white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .instruction { font-size: 11px; color: #ccc; margin-top: 2px; }
    .warning { color: #ff8; font-size: 11px; }
    #disconnect-btn { position: absolute; bottom: 20px; right: 20px; z-index: 30; background: #a33; color: white; border: 1px solid white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; display: none; }
  </style>
</head>
<body>
  <div id="divider"></div>
  <div id="score-center">0 : 0</div>
  <div id="camera-panel">
    <video id="input-video" autoplay playsinline muted></video>
  </div>
  <div id="game-panel">
    <video id="remote-video" autoplay playsinline></video>
    <canvas id="game-canvas"></canvas>
    <div id="ui">
      <span id="room-id-display"></span>
      <button id="copy-link-btn">Копировать ссылку</button>
      <span id="status-text"></span>
      <span id="ice-status"></span>
      <span id="mic-status" title="Микрофон">🔇</span>
      <div id="guest-join-form" style="display: none;">
        <input id="room-input" type="text" placeholder="ID комнаты">
        <button id="join-btn">Подключиться</button>
      </div>
    </div>
    <div id="signaling-panel" style="display: none;">
      <span id="sig-title">Ручная сигнализация</span>
      <div class="sdp-block">
        <textarea id="local-sdp" placeholder="Ваш SDP появится здесь" readonly></textarea>
        <button class="copy-sdp-btn" id="copy-local-sdp">📋 Копировать</button>
      </div>
      <div class="sdp-block">
        <textarea id="remote-sdp" placeholder="Вставьте SDP собеседника"></textarea>
      </div>
      <button id="create-offer-btn">Создать предложение (хост)</button>
      <button id="accept-offer-btn">Принять предложение и ответить (гость)</button>
      <button id="send-answer-btn" style="display:none;">📤 Отправить ответ хосту</button>
      <button id="accept-answer-btn" disabled>Принять ответ (хост)</button>
      <div id="instruction" class="instruction"></div>
      <div id="sdp-warning" class="warning"></div>
    </div>
    <button id="disconnect-btn">🔌 Отключиться</button>
    <button id="lang-switch">🌐</button>
  </div>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    (function() {
      // ---------- Переводы ----------
      const translations = {
        ru: {
          room_prefix: 'ID комнаты:',
          copy_link: 'Копировать ссылку',
          join: 'Подключиться',
          room_placeholder: 'ID комнаты',
          signaling_title: 'Ручная сигнализация',
          local_sdp_placeholder: 'Ваш SDP появится здесь',
          remote_sdp_placeholder: 'Вставьте SDP собеседника',
          create_offer: 'Создать предложение (хост)',
          accept_offer: 'Принять предложение и ответить (гость)',
          accept_answer: 'Принять ответ (хост)',
          send_answer: '📤 Отправить ответ хосту',
          close_connection: 'Отключиться',
          status_waiting: 'Ожидание соперника...',
          status_gathering: 'Сбор ICE-кандидатов...',
          status_offer_ready: 'Предложение готово, скопируйте SDP',
          status_waiting_answer: 'Ожидание ответа...',
          status_connecting: 'Установка соединения...',
          status_connected: 'Соперник подключился!',
          status_disconnected: 'Соперник отключился',
          alert_camera: 'Не удалось запустить камеру/микрофон. Проверьте разрешения и HTTPS.',
          alert_bad_sdp: 'Ошибка: неверный формат SDP. Подробности в консоли (F12).',
          mic_title: 'Микрофон',
          ice_checking: 'Проверка соединения...',
          ice_connected: 'Канал установлен',
          ice_disconnected: 'Канал разорван',
          link_copied: 'Ссылка скопирована!',
          host_waiting: 'Отправьте SDP гостю',
          copy_sdp: '📋 Копировать',
          sdp_copied: 'SDP скопирован!',
          instruction_guest: 'Вставьте SDP хоста (offer) выше и нажмите "Принять предложение".',
          instruction_host: 'Создайте предложение, отправьте его гостю. После получения ответа вставьте его и нажмите "Принять ответ".',
          answer_ready: 'Ваш ответ готов! Нажмите "Отправить ответ хосту", скопируйте SDP и передайте его хосту.',
          alert_empty_sdp: 'Поле SDP не должно быть пустым.',
          alert_invalid_json: 'Текст не является корректным JSON.',
          alert_missing_type_sdp: 'Объект должен содержать поля "type" и "sdp".',
          alert_wrong_type_guest: 'Ожидался offer, но получен SDP типа "{type}". Убедитесь, что вы вставили предложение от хоста.',
          alert_wrong_type_host: 'Ожидался answer, но получен SDP типа "{type}". Убедитесь, что вы вставили ответ от гостя.'
        },
        en: {
          room_prefix: 'Room ID:',
          copy_link: 'Copy link',
          join: 'Connect',
          room_placeholder: 'Room ID',
          signaling_title: 'Manual Signaling',
          local_sdp_placeholder: 'Your SDP will appear here',
          remote_sdp_placeholder: 'Paste opponent SDP',
          create_offer: 'Create Offer (host)',
          accept_offer: 'Accept Offer & Answer (guest)',
          accept_answer: 'Accept Answer (host)',
          send_answer: '📤 Send answer to host',
          close_connection: 'Disconnect',
          status_waiting: 'Waiting for opponent...',
          status_gathering: 'Gathering ICE candidates...',
          status_offer_ready: 'Offer ready, copy SDP',
          status_waiting_answer: 'Waiting for answer...',
          status_connecting: 'Establishing connection...',
          status_connected: 'Opponent connected!',
          status_disconnected: 'Opponent disconnected',
          alert_camera: 'Could not access camera/mic. Check permissions and HTTPS.',
          alert_bad_sdp: 'Error: invalid SDP format. Details in console (F12).',
          mic_title: 'Microphone',
          ice_checking: 'Checking connection...',
          ice_connected: 'Channel established',
          ice_disconnected: 'Channel disconnected',
          link_copied: 'Link copied!',
          host_waiting: 'Send SDP to guest',
          copy_sdp: '📋 Copy',
          sdp_copied: 'SDP copied!',
          instruction_guest: 'Paste host SDP (offer) above and press "Accept Offer".',
          instruction_host: 'Create offer, send it to guest. After receiving answer, paste it and press "Accept Answer".',
          answer_ready: 'Your answer is ready! Click "Send answer to host", copy SDP and send it to the host.',
          alert_empty_sdp: 'SDP field must not be empty.',
          alert_invalid_json: 'Text is not valid JSON.',
          alert_missing_type_sdp: 'Object must contain "type" and "sdp" fields.',
          alert_wrong_type_guest: 'Expected offer, but received SDP of type "{type}". Make sure you pasted the offer from the host.',
          alert_wrong_type_host: 'Expected answer, but received SDP of type "{type}". Make sure you pasted the answer from the guest.'
        }
      };

      let currentLang = 'ru';
      function detectLanguage() {
        const saved = localStorage.getItem('pong-lang');
        if (saved === 'ru' || saved === 'en') return saved;
        return navigator.language.startsWith('ru') ? 'ru' : 'en';
      }
      function t(key, params) { let str = translations[currentLang][key] || key; if (params) Object.entries(params).forEach(([k,v]) => str = str.replace(`{${k}}`, v)); return str; }
      function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('pong-lang', lang);
        applyTranslations();
        updateLangSwitchButton();
      }
      function applyTranslations() {
        document.querySelector('#sig-title').textContent = t('signaling_title');
        document.querySelector('#local-sdp').placeholder = t('local_sdp_placeholder');
        document.querySelector('#remote-sdp').placeholder = t('remote_sdp_placeholder');
        document.querySelector('#create-offer-btn').textContent = t('create_offer');
        document.querySelector('#accept-offer-btn').textContent = t('accept_offer');
        document.querySelector('#accept-answer-btn').textContent = t('accept_answer');
        document.querySelector('#send-answer-btn').textContent = t('send_answer');
        document.querySelector('#disconnect-btn').textContent = '🔌 ' + t('close_connection');
        document.querySelector('#mic-status').title = t('mic_title');
        document.querySelector('#copy-link-btn').textContent = t('copy_link');
        document.querySelector('#join-btn').textContent = t('join');
        document.querySelector('#room-input').placeholder = t('room_placeholder');
        document.querySelector('#copy-local-sdp').textContent = t('copy_sdp');
        if (window._instructionKey) setInstruction(window._instructionKey);
        if (window._iceStatusKey) setIceStatus(window._iceStatusKey);
        if (window._statusKey) setStatus(window._statusKey);
      }
      function updateLangSwitchButton() {
        document.getElementById('lang-switch').textContent = currentLang === 'ru' ? '🇷🇺' : '🇬🇧';
      }
      document.getElementById('lang-switch').addEventListener('click', () => {
        setLanguage(currentLang === 'ru' ? 'en' : 'ru');
      });

      function setStatus(key) { window._statusKey = key; document.getElementById('status-text').textContent = t(key); }
      function setIceStatus(key) { window._iceStatusKey = key; document.getElementById('ice-status').textContent = t(key); }
      function setInstruction(key) { window._instructionKey = key; document.getElementById('instruction').textContent = t(key); }
      function showSdpWarning(msg) { document.getElementById('sdp-warning').textContent = msg; setTimeout(() => { document.getElementById('sdp-warning').textContent = ''; }, 5000); }

      // ---------- DOM ----------
      const inputVideo = document.getElementById('input-video');
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const remoteVideo = document.getElementById('remote-video');
      const scoreCenter = document.getElementById('score-center');
      const roomIdDisplay = document.getElementById('room-id-display');
      const copyLinkBtn = document.getElementById('copy-link-btn');
      const guestJoinForm = document.getElementById('guest-join-form');
      const roomInput = document.getElementById('room-input');
      const joinBtn = document.getElementById('join-btn');
      const micStatus = document.getElementById('mic-status');
      const signalingPanel = document.getElementById('signaling-panel');
      const localSdpText = document.getElementById('local-sdp');
      const remoteSdpText = document.getElementById('remote-sdp');
      const copyLocalSdpBtn = document.getElementById('copy-local-sdp');
      const createOfferBtn = document.getElementById('create-offer-btn');
      const acceptOfferBtn = document.getElementById('accept-offer-btn');
      const sendAnswerBtn = document.getElementById('send-answer-btn');
      const acceptAnswerBtn = document.getElementById('accept-answer-btn');
      const disconnectBtn = document.getElementById('disconnect-btn');

      // ---------- Игра ----------
      let canvasWidth, canvasHeight;
      const paddleWidth = 12, paddleHeight = 80;
      const playerPaddle = { x: 20, y: 0 };
      const aiPaddle = { x: 0, y: 0 };
      const ball = { x: 0, y: 0, radius: 8, vx: 0, vy: 0, speed: 5 };
      let scorePlayer = 0, scoreAI = 0;
      let targetHandY = 0.5;
      let handDetected = false;
      let gameRunning = false;

      // WebRTC
      let pc = null;
      let dc = null;
      let isHost = false;
      let remotePaddleY = 0;
      let localStream;
      let currentRoomId = '';

      const rtcConfig = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }
        ]
      };

      const urlParams = new URLSearchParams(window.location.search);
      const roomFromUrl = urlParams.get('room');

      function resizeCanvas() {
        const gamePanel = document.getElementById('game-panel');
        canvasWidth = gamePanel.clientWidth;
        canvasHeight = gamePanel.clientHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        playerPaddle.x = 20;
        aiPaddle.x = canvasWidth - paddleWidth - 20;
        playerPaddle.y = (canvasHeight - paddleHeight) / 2;
        aiPaddle.y = (canvasHeight - paddleHeight) / 2;
        resetBall();
      }

      function resetBall() {
        ball.x = canvasWidth / 2;
        ball.y = canvasHeight / 2;
        const angle = (Math.random() * 0.5 + 0.25) * Math.PI;
        const dir = Math.random() < 0.5 ? 1 : -1;
        ball.vx = ball.speed * Math.cos(angle) * dir;
        ball.vy = ball.speed * Math.sin(angle) * (Math.random() < 0.5 ? 1 : -1);
      }

      function updateScoreDisplay() { scoreCenter.textContent = `${scorePlayer} : ${scoreAI}`; }

      function gameLoop() {
        if (!canvasWidth || !canvasHeight) {
          requestAnimationFrame(gameLoop);
          return;
        }

        if (handDetected) {
          let desiredCenterY = targetHandY * canvasHeight;
          desiredCenterY = Math.max(paddleHeight / 2, Math.min(canvasHeight - paddleHeight / 2, desiredCenterY));
          playerPaddle.y = desiredCenterY - paddleHeight / 2;
          if (!gameRunning) gameRunning = true;
        } else {
          gameRunning = false;
        }

        // Обновление соперника
        if (!dc || dc.readyState !== 'open') {
          if (gameRunning) {
            const aiCenterY = aiPaddle.y + paddleHeight / 2;
            if (ball.y < aiCenterY - 5) aiPaddle.y -= 4.5;
            else if (ball.y > aiCenterY + 5) aiPaddle.y += 4.5;
          }
        } else {
          aiPaddle.y = remotePaddleY;
        }
        aiPaddle.y = Math.max(0, Math.min(canvasHeight - paddleHeight, aiPaddle.y));

        // Отправка своей позиции
        if (dc && dc.readyState === 'open' && handDetected) {
          try { dc.send(JSON.stringify({ type: 'paddleUpdate', y: playerPaddle.y })); } catch(e) {}
        }

        // Физика мяча
        if (!dc || dc.readyState !== 'open' || isHost) {
          if (gameRunning) {
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvasHeight) {
              ball.vy *= -1;
              ball.y = Math.max(ball.radius, Math.min(canvasHeight - ball.radius, ball.y));
            }

            if (ball.vx < 0 && ball.x - ball.radius <= playerPaddle.x + paddleWidth &&
                ball.x - ball.radius >= playerPaddle.x &&
                ball.y >= playerPaddle.y && ball.y <= playerPaddle.y + paddleHeight) {
              const hit = (ball.y - playerPaddle.y) / paddleHeight;
              const angle = (hit - 0.5) * (Math.PI / 3);
              ball.vx = ball.speed * Math.cos(angle);
              ball.vy = ball.speed * Math.sin(angle);
              if (ball.vx < 0) ball.vx *= -1;
              ball.speed = Math.min(ball.speed + 0.2, 12);
            }
            if (ball.vx > 0 && ball.x + ball.radius >= aiPaddle.x &&
                ball.x + ball.radius <= aiPaddle.x + paddleWidth &&
                ball.y >= aiPaddle.y && ball.y <= aiPaddle.y + paddleHeight) {
              const hit = (ball.y - aiPaddle.y) / paddleHeight;
              const angle = (hit - 0.5) * (Math.PI / 3);
              ball.vx = -ball.speed * Math.cos(angle);
              ball.vy = ball.speed * Math.sin(angle);
              if (ball.vx > 0) ball.vx *= -1;
              ball.speed = Math.min(ball.speed + 0.2, 12);
            }

            if (ball.x + ball.radius < 0) { scoreAI++; updateScoreDisplay(); resetBall(); }
            else if (ball.x - ball.radius > canvasWidth) { scorePlayer++; updateScoreDisplay(); resetBall(); }
          }

          if (dc && dc.readyState === 'open' && isHost) {
            try {
              dc.send(JSON.stringify({
                type: 'gameState',
                ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, speed: ball.speed },
                score: { player: scorePlayer, ai: scoreAI },
              }));
            } catch(e) {}
          }
        } else {
          // Гость: ничего не делаем с мячом, он уже обновлён через onmessage
        }

        // Отрисовка
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        ctx.fillStyle = 'white';
        ctx.fillRect(playerPaddle.x, playerPaddle.y, paddleWidth, paddleHeight);
        ctx.fillRect(aiPaddle.x, aiPaddle.y, paddleWidth, paddleHeight);
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.closePath();

        requestAnimationFrame(gameLoop);
      }

      // ---------- MediaPipe ----------
      function onResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const lm = results.multiHandLandmarks[0];
          targetHandY = (lm[4].y + lm[8].y) / 2;
          handDetected = true;
        } else {
          handDetected = false;
        }
      }

      async function initCameraAndMediaPipe() {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
          audio: true
        });
        inputVideo.srcObject = localStream;
        inputVideo.muted = true;
        updateMicStatus();

        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.7,
          minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);
        async function detectLoop() {
          if (inputVideo.readyState >= 2) await hands.send({ image: inputVideo });
          requestAnimationFrame(detectLoop);
        }
        detectLoop();
      }

      function updateMicStatus() {
        if (!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack && audioTrack.enabled) {
          micStatus.textContent = '🎤';
          micStatus.style.color = '#0f0';
        } else {
          micStatus.textContent = '🔇';
          micStatus.style.color = '#ff0';
        }
      }

      micStatus.addEventListener('click', () => {
        if (localStream) {
          const audioTrack = localStream.getAudioTracks()[0];
          if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            updateMicStatus();
          }
        }
      });

      // ---------- WebRTC ----------
      function createPeerConnection() {
        if (pc) { pc.close(); pc = null; }
        if (dc) { dc.close(); dc = null; }

        const newPc = new RTCPeerConnection(rtcConfig);
        console.log('PeerConnection создан');

        newPc.ontrack = (event) => {
          if (event.streams && event.streams[0]) {
            remoteVideo.srcObject = event.streams[0];
            setStatus('status_connected');
            // Скрываем панель сигнализации, показываем кнопку "Отключиться"
            signalingPanel.classList.add('hidden');
            disconnectBtn.style.display = 'block';
          }
        };

        newPc.oniceconnectionstatechange = () => {
          const state = newPc.iceConnectionState;
          console.log('ICE состояние:', state);
          if (state === 'checking') { setIceStatus('ice_checking'); setStatus('status_connecting'); }
          else if (state === 'connected' || state === 'completed') {
            setIceStatus('ice_connected');
            setStatus('status_connected');
            signalingPanel.classList.add('hidden');
            disconnectBtn.style.display = 'block';
          } else if (state === 'disconnected' || state === 'failed') {
            setIceStatus('ice_disconnected');
            setStatus('status_disconnected');
            // Показываем панель снова, если захотим переподключиться
            signalingPanel.classList.remove('hidden');
            disconnectBtn.style.display = 'none';
          }
        };

        if (isHost) {
          const newDc = newPc.createDataChannel('game');
          setupDataChannel(newDc);
        } else {
          newPc.ondatachannel = (event) => {
            setupDataChannel(event.channel);
          };
        }

        if (localStream) {
          localStream.getTracks().forEach(track => newPc.addTrack(track, localStream));
        }

        pc = newPc;
        return newPc;
      }

      function setupDataChannel(channel) {
        channel.onopen = () => {
          console.log('DataChannel открыт');
          if (isHost) {
            dc.send(JSON.stringify({ type: 'init', host: true }));
          }
          // Скрываем панель, показываем кнопку отключения
          signalingPanel.classList.add('hidden');
          disconnectBtn.style.display = 'block';
        };
        channel.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'paddleUpdate') {
              remotePaddleY = msg.y;
            } else if (msg.type === 'gameState' && !isHost) {
              ball.x = msg.ball.x;
              ball.y = msg.ball.y;
              ball.vx = msg.ball.vx;
              ball.vy = msg.ball.vy;
              ball.speed = msg.ball.speed;
              scorePlayer = msg.score.player;
              scoreAI = msg.score.ai;
              updateScoreDisplay();
            }
          } catch(e) { console.error('Ошибка данных:', e); }
        };
        channel.onclose = () => {
          console.log('DataChannel закрыт');
          dc = null;
          remotePaddleY = 0;
          if (remoteVideo.srcObject) remoteVideo.srcObject = null;
          setStatus('status_disconnected');
          signalingPanel.classList.remove('hidden');
          disconnectBtn.style.display = 'none';
        };
        channel.onerror = (err) => console.error('Ошибка DataChannel:', err);
        dc = channel;
      }

      function closeConnection() {
        if (dc) { dc.close(); dc = null; }
        if (pc) { pc.close(); pc = null; }
        remoteVideo.srcObject = null;
        remotePaddleY = 0;
        localSdpText.value = '';
        acceptOfferBtn.disabled = false;
        acceptAnswerBtn.disabled = true;
        sendAnswerBtn.style.display = 'none';
        setIceStatus('');
        setInstruction('');
        document.getElementById('sdp-warning').textContent = '';
        signalingPanel.classList.remove('hidden');
        disconnectBtn.style.display = 'none';
        setStatus('status_disconnected');
      }

      disconnectBtn.addEventListener('click', closeConnection);

      // Валидация SDP
      function parseRemoteSDP(text) {
        if (!text) { alert(t('alert_empty_sdp')); return null; }
        try {
          const desc = JSON.parse(text);
          if (!desc.type || !desc.sdp) { alert(t('alert_missing_type_sdp')); return null; }
          return desc;
        } catch (e) { alert(t('alert_invalid_json')); return null; }
      }

      // ----- Копирование SDP -----
      copyLocalSdpBtn.addEventListener('click', () => {
        const text = localSdpText.value.trim();
        if (text) {
          navigator.clipboard.writeText(text).then(() => {
            copyLocalSdpBtn.textContent = '✅ ' + t('sdp_copied');
            setTimeout(() => { copyLocalSdpBtn.textContent = t('copy_sdp'); }, 2000);
          }).catch(() => {
            localSdpText.select(); document.execCommand('copy');
            copyLocalSdpBtn.textContent = '✅ ' + t('sdp_copied');
            setTimeout(() => { copyLocalSdpBtn.textContent = t('copy_sdp'); }, 2000);
          });
        }
      });

      // ----- Сигнализация -----
      createOfferBtn.addEventListener('click', async () => {
        createOfferBtn.disabled = true;
        isHost = true;
        closeConnection();
        const currentPc = createPeerConnection();
        setStatus('status_gathering');
        setInstruction('');

        try {
          const offer = await currentPc.createOffer();
          await currentPc.setLocalDescription(offer);
          await new Promise(resolve => {
            if (currentPc.iceGatheringState === 'complete') resolve();
            else currentPc.onicegatheringstatechange = () => {
              if (currentPc.iceGatheringState === 'complete') resolve();
            };
          });
          localSdpText.value = JSON.stringify(currentPc.localDescription);
          setStatus('status_offer_ready');
          setInstruction('instruction_host');
          acceptAnswerBtn.disabled = false;
          sendAnswerBtn.style.display = 'none';
        } catch (e) {
          console.error(e);
          alert(t('alert_bad_sdp'));
          closeConnection();
          setStatus('status_waiting');
        } finally {
          createOfferBtn.disabled = false;
        }
      });

      acceptOfferBtn.addEventListener('click', async () => {
        acceptOfferBtn.disabled = true;
        const remoteStr = remoteSdpText.value.trim().replace(/^[\s\uFEFF\xA0]+|[\s\uFEFF\xA0]+$/g, '');
        const remoteDesc = parseRemoteSDP(remoteStr);
        if (!remoteDesc) { acceptOfferBtn.disabled = false; return; }
        if (remoteDesc.type !== 'offer') {
          showSdpWarning(t('alert_wrong_type_guest', { type: remoteDesc.type }));
          acceptOfferBtn.disabled = false;
          return;
        }

        isHost = false;
        closeConnection();
        const currentPc = createPeerConnection();
        setStatus('status_connecting');
        setInstruction('instruction_guest');

        try {
          await currentPc.setRemoteDescription(new RTCSessionDescription(remoteDesc));
          setStatus('status_gathering');
          const answer = await currentPc.createAnswer();
          await currentPc.setLocalDescription(answer);
          await new Promise(resolve => {
            if (currentPc.iceGatheringState === 'complete') resolve();
            else currentPc.onicegatheringstatechange = () => {
              if (currentPc.iceGatheringState === 'complete') resolve();
            };
          });
          localSdpText.value = JSON.stringify(currentPc.localDescription);
          setStatus('status_waiting_answer');
          setInstruction('answer_ready');
          sendAnswerBtn.style.display = 'block';
        } catch (e) {
          console.error(e);
          alert(t('alert_bad_sdp'));
          closeConnection();
          setStatus('status_waiting');
          acceptOfferBtn.disabled = false;
        }
      });

      sendAnswerBtn.addEventListener('click', () => {
        const text = localSdpText.value.trim();
        if (text) {
          navigator.clipboard.writeText(text).then(() => {
            alert(t('sdp_copied') + ' ' + t('host_waiting'));
          }).catch(() => {
            localSdpText.select(); document.execCommand('copy');
            alert(t('sdp_copied') + ' ' + t('host_waiting'));
          });
        }
        setStatus('status_waiting_answer');
        setInstruction('answer_ready');
      });

      acceptAnswerBtn.addEventListener('click', async () => {
        acceptAnswerBtn.disabled = true;
        const remoteStr = remoteSdpText.value.trim().replace(/^[\s\uFEFF\xA0]+|[\s\uFEFF\xA0]+$/g, '');
        const remoteDesc = parseRemoteSDP(remoteStr);
        if (!remoteDesc) { acceptAnswerBtn.disabled = false; return; }
        if (remoteDesc.type !== 'answer') {
          showSdpWarning(t('alert_wrong_type_host', { type: remoteDesc.type }));
          acceptAnswerBtn.disabled = false;
          return;
        }

        const currentPc = pc;
        if (!currentPc) { alert('Нет активного соединения.'); acceptAnswerBtn.disabled = false; return; }

        try {
          await currentPc.setRemoteDescription(new RTCSessionDescription(remoteDesc));
          setStatus('status_connecting');
          setInstruction('');
        } catch (e) {
          console.error(e);
          alert(t('alert_bad_sdp'));
          closeConnection();
          acceptAnswerBtn.disabled = false;
          setStatus('status_waiting');
        }
      });

      // ----- Комната -----
      function generateRoomId() { return 'pong-' + Math.random().toString(36).substring(2, 10); }

      function updateRoomDisplay(roomId) {
        roomIdDisplay.textContent = t('room_prefix') + ' ' + roomId;
        if (isHost) {
          copyLinkBtn.style.display = 'inline-block';
          guestJoinForm.style.display = 'none';
          signalingPanel.style.display = 'block';
          setInstruction('instruction_host');
        } else {
          copyLinkBtn.style.display = 'none';
          guestJoinForm.style.display = roomFromUrl ? 'none' : 'flex';
          signalingPanel.style.display = 'block';
          setInstruction('instruction_guest');
        }
      }

      copyLinkBtn.addEventListener('click', () => {
        const url = new URL(window.location.href);
        url.searchParams.set('room', currentRoomId);
        navigator.clipboard.writeText(url.toString()).then(() => {
          setStatus('link_copied');
          setTimeout(() => { if (window._statusKey === 'link_copied') setStatus('status_waiting'); }, 2000);
        });
      });

      joinBtn.addEventListener('click', () => {
        const newRoom = roomInput.value.trim();
        if (newRoom) {
          isHost = false;
          currentRoomId = newRoom;
          const url = new URL(window.location.href);
          url.searchParams.set('room', newRoom);
          window.history.replaceState({}, '', url.toString());
          updateRoomDisplay(newRoom);
          guestJoinForm.style.display = 'none';
          setStatus('status_waiting');
        }
      });

      // ---------- Старт ----------
      window.addEventListener('load', async () => {
        currentLang = detectLanguage();
        setLanguage(currentLang);
        try {
          await initCameraAndMediaPipe();
          resizeCanvas();
          updateScoreDisplay();
          window.addEventListener('resize', resizeCanvas);
          gameLoop();

          if (roomFromUrl) {
            isHost = false;
            currentRoomId = roomFromUrl;
            updateRoomDisplay(roomFromUrl);
            setStatus('status_waiting');
          } else {
            isHost = true;
            currentRoomId = generateRoomId();
            window.history.replaceState({}, '', `${location.pathname}?room=${currentRoomId}`);
            updateRoomDisplay(currentRoomId);
            setStatus('status_waiting');
          }
        } catch (err) {
          console.error(err);
          alert(t('alert_camera'));
        }
      });
    })();
  </script>
</body>
</html>
